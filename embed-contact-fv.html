<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Contact FV (embed) | Recologne</title>
<base target="_top">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Embed part for the STUDIO contact page: breadcrumb + title + lede only.
     The header and the form live natively in STUDIO. See the query options at the bottom. */
  :root{
    --ink:#1c1c1e;--ink-dim:#6b6b70;--page-bg:#f2f2f2;
    --mono:"Orbitron", ui-monospace,"Cascadia Code","Roboto Mono","SFMono-Regular",Menlo,Consolas,"Courier New",monospace;
    --sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Yu Gothic","Meiryo",system-ui,sans-serif;
    --top:72px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--page-bg);color:var(--ink);font-family:var(--sans);overflow:hidden;}
  a{color:inherit;text-decoration:none;}

  .contact-container{max-width:1400px;margin:0 auto;padding:var(--top) 40px 0;}
  .breadcrumb{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink-dim);padding:28px 0 0;}
  .breadcrumb a:hover{color:var(--ink);}
  .breadcrumb span.sep{opacity:.5;}
  .breadcrumb span.current{color:var(--ink);}
  .contact-title{margin:26px 0 0;font-family:var(--mono);font-weight:800;font-size:clamp(32px,5vw,64px);line-height:.9;letter-spacing:.01em;color:#222;}
  .contact-lede{margin:26px 0 0;max-width:720px;font-size:14px;line-height:1.9;color:var(--ink-dim);}

  @media (max-width:768px){
    .contact-container{padding-left:30px;padding-right:30px;}
  }
</style>
</head>
<body>
  <div class="contact-container" id="embedRoot">
    <nav class="breadcrumb" aria-label="breadcrumb">
      <a href="index.html" data-path="/">Home</a><span class="sep">/</span><span class="current">Contact</span>
    </nav>
    <h1 class="contact-title">CONTACT</h1>
    <p class="contact-lede">サービスに関するご相談、お見積り、取材のご依頼など、お気軽にお問い合わせください。内容を確認のうえ、担当者よりご連絡いたします。</p>
  </div>

<script>
/* Query options (put them on the iframe src):
   ?base=https://example.com  site that owns the links; links with data-path become base + data-path
                              (without it, document.referrer's origin is used, then the relative .html links)
   &top=0                     top padding in px (default 72 = clears a fixed STUDIO header; 0 for none)
   &name=contact-fv           name sent with the height message
   The page posts {type:'recologne-embed-height', name, height} to the parent so the parent can size the iframe. */
(function(){
  var qs = new URLSearchParams(location.search);
  var base = qs.get('base') || '';
  if (!base){ try { base = new URL(document.referrer).origin; } catch(e){} }
  if (base === location.origin) base = '';
  if (base){
    base = base.replace(/\/$/, '');
    document.querySelectorAll('a[data-path]').forEach(function(a){
      a.href = base + a.getAttribute('data-path');
    });
  }
  var top = qs.get('top');
  if (top !== null && !isNaN(parseFloat(top))) document.documentElement.style.setProperty('--top', parseFloat(top) + 'px');

  var name = qs.get('name') || 'contact-fv';
  var last = 0;
  function send(){
    var h = Math.ceil(document.getElementById('embedRoot').getBoundingClientRect().height);
    if (h === last) return;
    last = h;
    try { parent.postMessage({ type:'recologne-embed-height', name:name, height:h }, '*'); } catch(e){}
  }
  window.addEventListener('load', send);
  window.addEventListener('resize', send);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(send);
  if ('ResizeObserver' in window) new ResizeObserver(send).observe(document.getElementById('embedRoot'));
  send();
})();
</script>
</body>
</html>
